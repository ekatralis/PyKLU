name: Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libopenblas-dev

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
        env:
          PYKLU_DISABLE_FORTRAN: "1"

      - name: Run tests
        run: python -m pytest
